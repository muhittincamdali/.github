name: Feature request
description: Suggest a new capability or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. A code sketch of the API you have in mind helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use now or other designs you thought about.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to work on it?
      options:
        - Yes, I can open a pull request
        - I can help test it
        - No
    validations:
      required: true
