version: 2
updates:
  # Keeps the SHA-pinned actions in the reusable workflows current; each update arrives as a pull
  # request with the new SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
