name: README translations

# Reusable: keeps README.<lang>.md files honest about which English README they translate.
# Each translation starts with
#
#   <!-- i18n-source: README.md@<git blob SHA of README.md> status=reviewed -->
#
# and carries the same language selector block as README.md. `git diff <blob> README.md` shows a
# translator exactly what changed since their version. Checks:
#   errors   - marker missing or malformed; selector block differs between files; a translation
#              that claims the current English version but has different code blocks or URLs.
#   warnings - translation behind README.md; status=draft; expected language file missing.
#              With strict: true, warnings fail too.
#
#   jobs:
#     i18n:
#       uses: muhittincamdali/.github/.github/workflows/readme-i18n-sync.yml@<sha> # v1

on:
  workflow_call:
    inputs:
      languages:
        description: Space-separated language codes expected as README.<code>.md.
        type: string
        default: tr zh-CN ja ko es de fr pt-BR ru
      strict:
        type: boolean
        default: false

permissions: {}

concurrency:
  group: reusable-readme-i18n-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check translations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check
        env:
          LANGUAGES: ${{ inputs.languages }}
          STRICT: ${{ inputs.strict }}
        shell: python3 -I {0}
        run: |
          import os, re, subprocess, sys

          MARKER = re.compile(r"<!-- i18n-source: README\.md@([0-9a-f]{40}) status=(draft|reviewed) -->")
          SELECTOR = re.compile(r"<!-- lang-selector:start -->(.*?)<!-- lang-selector:end -->", re.S)
          FENCE = re.compile(r"^(`{3,}|~{3,})[^\n]*\n(.*?)^\1[ \t]*$", re.S | re.M)
          URL = re.compile(r"https?://[^\s)\"'<>]+")
          BRAND = re.compile(r"<!-- brand:start -->.*?<!-- brand:end -->", re.S)

          def read(path):
              with open(path, encoding="utf-8") as handle:
                  return handle.read()

          def selector(text):
              match = SELECTOR.search(text)
              return match.group(1).strip() if match else None

          def blocks(text):
              return [body.rstrip() for _, body in FENCE.findall(text)]

          errors, warnings, rows = [], [], []
          source = read("README.md")
          current = subprocess.run(["git", "hash-object", "README.md"], capture_output=True, text=True, check=True).stdout.strip()
          source_selector = selector(source)
          expected = os.environ["LANGUAGES"].split()
          present = sorted(f for f in os.listdir(".") if re.fullmatch(r"README\.[A-Za-z]{2}(?:-[A-Za-z]{2,4})?\.md", f))

          if present and source_selector is None:
              errors.append("README.md has translations but no lang-selector block")
          for code in expected:
              if f"README.{code}.md" not in present:
                  warnings.append(f"README.{code}.md is missing")

          for path in present:
              text = read(path)
              marker = MARKER.search(text)
              if not marker:
                  errors.append(f"{path}: no i18n-source marker")
                  rows.append((path, "-", "no marker"))
                  continue
              blob, status = marker.groups()
              fresh = blob == current
              if selector(text) != source_selector:
                  errors.append(f"{path}: language selector differs from README.md")
              if fresh:
                  if blocks(text) != blocks(source):
                      errors.append(f"{path}: code blocks differ from README.md although it claims the current version")
                  missing = sorted(set(URL.findall(BRAND.sub("", source))) - set(URL.findall(BRAND.sub("", text))))
                  if missing:
                      errors.append(f"{path}: URLs missing compared with README.md: {', '.join(missing[:5])}")
              else:
                  warnings.append(f"{path}: translates README.md@{blob[:12]}, current is {current[:12]} (git diff {blob[:12]} {current[:12]})")
              if status == "draft":
                  warnings.append(f"{path}: status=draft")
              rows.append((path, blob[:12], ("current" if fresh else "behind") + f", {status}"))

          strict = os.environ["STRICT"] == "true"
          for message in errors:
              print(f"::error::{message}")
          for message in warnings:
              print(f"::{'error' if strict else 'warning'}::{message}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"## README translations\n\nREADME.md is `{current[:12]}`.\n\n| File | Source | State |\n| --- | --- | --- |\n")
                  handle.writelines(f"| {p} | `{b}` | {s} |\n" for p, b, s in rows)
          sys.exit(1 if errors or (strict and warnings) else 0)
